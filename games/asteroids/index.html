<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b28"><title>Asteroids</title><link rel="stylesheet" href="../shared/precision/precision.css?v=1.6.0"></head>
<body data-game="asteroids" data-state="menu">
<header><h1 id="name">Asteroids</h1><button id="pause" aria-label="Pausar jogo" disabled>Ⅱ</button></header>
<div class="stats" aria-label="Placar"><div><span>PONTOS</span><strong id="score">00000</strong></div><div><span>ONDA</span><strong id="wave">01</strong></div><div><span>VIDAS</span><strong id="lives">03</strong></div></div>
<main id="play-area"><div class="screen" id="screen"><canvas id="canvas" width="360" height="450" tabindex="0"></canvas></div>
<div id="countdown" hidden></div><section id="overlay" aria-labelledby="title"><div class="menu"><h2 id="title">Pronto para jogar?</h2><p id="intro"></p><div class="option" id="mode-row"><label for="variant">Modo</label><select id="variant"></select></div><button id="start">Jogar</button><button id="restart" hidden>Recomeçar partida</button><button id="help-toggle" aria-expanded="false" aria-controls="help">Como jogar</button><div id="help" hidden><ul id="rules"></ul><p>Recriação independente em HTML5. Não utiliza o cartucho original.</p></div><div class="settings"><button id="sound" aria-pressed="true">Som: ligado</button><button id="crt" aria-pressed="false">Efeito CRT</button></div><p class="best" id="best"></p></div></section></main>
<footer><div class="controls" role="group" aria-label="Controles do jogo"><button id="left" class="direction" data-input="left" aria-label="Mover para a esquerda">←</button><button id="right" class="direction" data-input="right" aria-label="Mover para a direita">→</button><button id="drag" aria-label="Arraste para mover a raquete" hidden>ARRASTE PARA MOVER</button><button id="thrust" data-input="up" hidden>IMPULSO</button><button id="action" class="action" data-input="action">ATIRAR</button><button id="hyper" data-input="down" hidden>HIPERESPAÇO</button></div><p id="hint"></p></footer><p id="status" role="status" aria-live="off"></p><script type="module" src="../shared/precision/runtime.js?v=1.6.0"></script></body></html>
