<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1422"><title>Bike Rider</title><link rel="stylesheet" href="../shared/championship.css"></head>
<body data-game="bike-rider" data-state="menu">
<header><div><small>SCORE</small><strong id="score">0</strong></div><strong id="game-name">Bike Rider</strong><span id="status"></span><button type="button" id="sound" aria-pressed="false">♪ Off</button><button type="button" id="pause" aria-label="Pause game" disabled>Ⅱ</button></header>
<main id="arena"><canvas id="canvas" width="420" height="600" tabindex="0" aria-label="Bike Rider play area. Space jump · ↑ pedal · ← → lean · Land with level wheels"></canvas><div id="countdown" aria-live="polite" hidden></div>
<section id="overlay" aria-labelledby="title"><div class="overlay-content"><p id="eyebrow"></p><h1 id="title">Bike Rider</h1><p id="instructions">Pedal, jump, and lean in the air. Match your wheels to the slope on landing. Clear gaps and reach checkpoints to save your position.</p><div id="stages" aria-label="Campaign events"></div><p id="best"></p><button type="button" id="start" disabled>Loading artwork…</button><div id="secondary-actions"><button type="button" id="retry" hidden>Restart event</button><button type="button" id="menu" hidden>Event selection</button></div></div></section></main>
<footer id="control-deck"><label id="power-row" hidden>POWER <input id="power" type="range" min="50" max="520" value="330" aria-label="Putt power"><output id="power-value" for="power">63%</output></label><div id="controls" aria-label="Game controls"></div><p id="hint"></p></footer>
<script type="module" src="../shared/runtime.js"></script></body></html>
