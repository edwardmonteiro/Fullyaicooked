<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c25"><title>Combat</title><link rel="stylesheet" href="../shared/nostalgia/nostalgia.css?v=1.7.0-final"></head>
<body data-game="combat" data-state="menu"><header><h1 id="name">Combat</h1><button id="pause" aria-label="Pausar jogo" disabled>Ⅱ</button></header>
<div class="stats" aria-label="Placar"><div><span id="label-0">VOCÊ</span><strong id="stat-0">00</strong></div><div><span id="label-1">RIVAL</span><strong id="stat-1">00</strong></div><div><span id="label-2">META</span><strong id="stat-2">99</strong></div></div>
<main id="play-area"><div id="screen"><canvas id="canvas" width="384" height="288" tabindex="0"></canvas></div><div id="countdown" hidden></div><section id="overlay" aria-labelledby="title"><div class="menu"><h2 id="title">Pronto para jogar?</h2><p id="intro"></p><div class="option" id="mode-row"><label for="variant">Modo</label><select id="variant"></select></div><button id="start">Jogar</button><button id="restart" hidden>Recomeçar partida</button><button id="help-toggle" aria-expanded="false" aria-controls="help">Como jogar</button><div id="help" hidden><ul id="rules"></ul><p>Recriação independente em HTML5, com arte e programação próprias.</p></div><div class="settings"><button id="sound" aria-pressed="true">Som: ligado</button><button id="crt" aria-pressed="false">Efeito CRT</button></div><p id="best"></p></div></section></main>
<footer><div class="controls" role="group" aria-label="Controles do jogo"><button id="left" class="arrow" data-input="left" aria-label="Mover para a esquerda">←</button><button id="right" class="arrow" data-input="right" aria-label="Mover para a direita">→</button><button id="up" data-input="up" aria-label="Mover para cima">↑</button><button id="down" data-input="down" aria-label="Mover para baixo">↓</button><button id="action" class="action" data-input="action">JOGAR</button></div><p id="hint"></p></footer><p id="status" role="status" aria-live="off"></p><script type="module" src="../shared/nostalgia/runtime.js?v=1.7.0-final"></script></body></html>
