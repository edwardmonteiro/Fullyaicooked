<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#19241a"><title>River Raid Tribute</title><link rel="stylesheet" href="../shared/retro/retro.css"></head>
<body data-game="river-raid" data-state="menu">
<header><div><span id="edition">2600 TRIBUTES</span><h2 id="name">River Raid Tribute</h2></div><button id="crt" type="button" aria-pressed="false" aria-label="Toggle CRT scanlines">CRT</button><button id="sound" type="button" aria-pressed="true">Sound on</button><button id="pause" type="button" aria-label="Pause game" disabled>Ⅱ</button></header>
<main><div id="screen-area"><canvas id="canvas" width="160" height="192" tabindex="0"></canvas></div><div id="countdown" aria-live="polite" hidden></div>
<section id="overlay" aria-labelledby="title"><div class="menu"><p id="subtitle"></p><h1 id="title">River Raid Tribute</h1><p id="instructions"></p><ul id="rules"></ul><button id="start" type="button">Start game</button><button id="restart" type="button" hidden>Restart from the beginning</button><p id="best"></p><p class="credit">An independent HTML5 tribute. Original code, artwork and layouts.</p></div></section></main>
<footer><p id="readout" aria-label="Game status"></p><div id="deck"><div class="dpad" role="group" aria-label="Directional controls"><button class="up" data-input="up" type="button" aria-label="Up">↑</button><button class="left" data-input="left" type="button" aria-label="Left">←</button><button class="right" data-input="right" type="button" aria-label="Right">→</button><button class="down" data-input="down" type="button" aria-label="Down or brake">↓</button></div><div class="control-copy"><p id="hint"></p></div><div class="action-wrap"><button id="action" data-input="action" type="button">ACTION</button></div></div></footer>
<script type="module" src="../shared/retro/runtime.js"></script></body></html>
