<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102725"><title>Triathlon Sprint</title><link rel="stylesheet" href="../shared/sports/sports.css"></head>
<body data-game="triathlon-sprint">
  <header><div><small>SCORE</small><strong id="score">0</strong></div><span id="status"></span><button type="button" id="sound" aria-pressed="false">Sound off</button><button type="button" id="pause" aria-label="Pause game" disabled>Ⅱ</button></header>
  <main id="arena">
    <canvas id="canvas" width="420" height="600" aria-label="Triathlon Sprint play area. Drag or use left/right arrows to steer. Hold Pace or Space to sprint. Avoid orange markers and collect energy rings." tabindex="0"></canvas>
    <section id="overlay" aria-labelledby="title"><img src="cover.webp" alt="" id="splash"><div class="overlay-content"><p id="eyebrow">FULLY AI COOKED ORIGINAL</p><h1 id="title">Triathlon Sprint</h1><p id="instructions">Drag or use left/right arrows to steer. Hold Pace or Space to sprint. Avoid orange markers and collect energy rings.</p><p id="best"></p><div id="scorecard" aria-label="Strokes per hole" hidden></div><button type="button" id="start" disabled>Loading game…</button></div></section>
  </main>
  <footer id="control-deck"><label id="power-row" hidden>POWER <input id="power" type="range" min="50" max="520" value="330" aria-label="Putt power"><output id="power-value" for="power">63%</output></label><div id="controls" aria-label="Game controls"></div><p id="hint"></p></footer>
  <script type="module" src="../shared/sports/shell.js"></script>
</body></html>
